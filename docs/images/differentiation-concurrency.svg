<text x="1562" y="644" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Pretendard, sans-serif" font-size="32" font-weight="500" fill="#e1ecff">8워커 전체 스캔</text>
<text x="44" y="802" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Pretendard, sans-serif" font-size="30" font-weight="900" fill="#233e94">비용도 확인: 스캔 p95 98.94 → 127.82 ms 증가 · ID 단건 처리량 약 7.7% 감소</text>
<text x="44" y="858" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Pretendard, sans-serif" font-size="28" font-weight="500" fill="#3b4d6b">p95 = 측정한 요청의 약 95%가 이 시간 안에 완료되는 응답 시간</text>
