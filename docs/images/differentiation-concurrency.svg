<svg xmlns="http://www.w3.org/2000/svg" width="2016" height="930" viewBox="0 0 2016 930">
<rect width="2016" height="930" fill="#f2f5f8"/>
<text x="44" y="42" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Pretendard, sans-serif" font-size="48" font-weight="900" fill="#17212d">동시 조회: 읽기끼리 기다리던 구간을 줄였다</text>
<text x="44" y="114" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Pretendard, sans-serif" font-size="28" font-weight="500" fill="#3b4d6b">실행 순서 개념도 · 상자 길이는 실제 소요 시간을 뜻하지 않음</text>
